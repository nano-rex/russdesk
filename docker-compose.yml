# RustDesk's open-source ID/relay servers plus RussDesk on port 21114.
# Clients only need the ID server address and the key: with the API server
# field left empty they use http://<ID server>:21114 automatically.
services:
  hbbs:
    image: rustdesk/rustdesk-server:latest
    command: hbbs
    volumes:
      - ./hbbs-data:/root
    network_mode: host
    depends_on: [hbbr]
    restart: unless-stopped

  hbbr:
    image: rustdesk/rustdesk-server:latest
    command: hbbr
    volumes:
      - ./hbbs-data:/root
    network_mode: host
    restart: unless-stopped

  russdesk:
    build: .
    environment:
      # Read hbbs' public key so the console can show it to clients.
      RUSSDESK_HBBS_KEY_FILE: /hbbs/id_ed25519.pub
      # Optional: fixed first admin password (otherwise one is printed in the log).
      # RUSSDESK_ADMIN_PASSWORD: change-me-now
    volumes:
      - ./russdesk-data:/data
      - ./hbbs-data:/hbbs:ro
    ports:
      - "21114:21114"
    restart: unless-stopped
