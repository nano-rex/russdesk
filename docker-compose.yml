# RustDesk's open-source ID/relay servers plus RussDesk, on ports 31114-31119:
#   31114 RussDesk console/API   31116 hbbs (TCP+UDP)   31117 hbbr
#   31115, 31118, 31119 hbbs NAT test and the WebSocket ports
# Start with:  RUSSDESK_HOST=rd.example.com docker compose up -d
# Clients need only the ID server (rd.example.com:31116) and the key: with the
# API server field empty they use port 31116 - 2 = 31114 automatically.
services:
  hbbs:
    image: rustdesk/rustdesk-server:latest
    command: hbbs -p 31116 -r ${RUSSDESK_HOST:?set RUSSDESK_HOST to your public name or IP}:31117
    volumes:
      - ./hbbs-data:/root
    network_mode: host
    depends_on: [hbbr]
    restart: unless-stopped

  hbbr:
    image: rustdesk/rustdesk-server:latest
    command: hbbr -p 31117
    volumes:
      - ./hbbs-data:/root
    network_mode: host
    restart: unless-stopped

  russdesk:
    build: .
    environment:
      RUSSDESK_ID_SERVER: ${RUSSDESK_HOST}:31116
      # Read hbbs' public key so the console can show it to clients.
      RUSSDESK_HBBS_KEY_FILE: /hbbs/id_ed25519.pub
      # Optional: fixed first admin password (otherwise one is printed in the log).
      # RUSSDESK_ADMIN_PASSWORD: change-me-now
    volumes:
      - ./russdesk-data:/data
      - ./hbbs-data:/hbbs:ro
    ports:
      - "31114:31114"
    restart: unless-stopped
