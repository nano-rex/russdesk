[package]
name = "russdesk"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
description = "Open-source web console and API server for self-hosted RustDesk (Rust rewrite)"
license = "AGPL-3.0-only"

[[bin]]
name = "russdesk"
path = "src/main.rs"

# No third-party crates: the standard library only. SQLite is the official
# amalgamation vendored under vendor/sqlite and compiled by build.rs; everything
# else (JSON, crypto, encodings, RNG, SMTP, HTTP) is implemented in-tree.
[dependencies]

[profile.release]
opt-level = 2
