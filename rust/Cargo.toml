[package]
name = "russdesk"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
description = "Open-source web console and API server for self-hosted RustDesk (Rust rewrite)"
license = "AGPL-3.0-only"

[[bin]]
name = "russdesk"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scrypt = { version = "0.11", default-features = false }
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
base64 = "0.22"
data-encoding = "2"        # base32 for TOTP secrets
subtle = "2"               # constant-time comparisons
getrandom = "0.2"

[profile.release]
opt-level = 2
