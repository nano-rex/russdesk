name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: API tests
        run: python -m unittest discover -s tests -v

  pro-scripts:
    # RustDesk Server Pro's own management scripts, unmodified, against RussDesk.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python tests/pro_scripts_test.py

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium
      - name: UI test
        run: python tests/ui_test.py
        env:
          UI_SHOTS: ui-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: ui-shots/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke-test the image
        run: |
          docker build -t russdesk .
          docker run -d --name rd -p 31114:31114 -e RUSSDESK_ADMIN_PASSWORD=ci-password-1 russdesk
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:31114/api/login-options && break; sleep 1; done
          curl -sf -X POST http://127.0.0.1:31114/api/heartbeat -d '{"id":"1","uuid":"u","modified_at":0}'
          docker logs rd

  baremetal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install with the bare-metal script
        run: sudo ./deploy/install.sh --host 127.0.0.1 --admin-password ci-password-1
      - name: Check services
        run: |
          systemctl is-active russdesk rustdesk-hbbs rustdesk-hbbr
          sudo ss -ltnup | grep -E ':3111[4-9]'
          curl -sf -c jar -H 'Content-Type: application/json' -d '{"username":"admin","password":"ci-password-1"}' http://127.0.0.1:31114/api/admin/login
          curl -sf -b jar http://127.0.0.1:31114/api/admin/client-config | tee cfg.json
          grep -q "$(sudo cat /var/lib/rustdesk-server/id_ed25519.pub)" cfg.json
      - name: Upgrade keeps data, uninstall removes services
        run: |
          sudo ./deploy/install.sh --host 127.0.0.1
          curl -sf -H 'Content-Type: application/json' -d '{"username":"admin","password":"ci-password-1"}' http://127.0.0.1:31114/api/admin/login
          sudo ./deploy/install.sh --uninstall
          ! systemctl is-active russdesk
