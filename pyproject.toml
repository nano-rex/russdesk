[project]
name = "russdesk"
version = "0.1.0"
description = "Open-source web console and API server for self-hosted RustDesk"
readme = "README.md"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.10"
dependencies = []

[project.scripts]
russdesk = "russdesk.__main__:main"

[tool.setuptools.packages.find]
include = ["russdesk*"]

[tool.setuptools.package-data]
russdesk = ["static/*", "static/vendor/*"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
